name: React Native CI/CD
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - prod-apk
          - all

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  build-and-release:
    needs: check-skip
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Gradle Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗 Setup Node.js & Yarn Cache
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "yarn"

      - name: ⚡ Setup C/C++ Cache (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-ccache

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 📱 Setup EAS build cache
        uses: actions/cache@v6
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-eas-build-local-

      - name: 🔄 Verify EAS CLI installation
        run: npx eas-cli --version

      - name: 📋 Fix package.json main entry
        run: |
          if [ -f ./package.json ]; then
            cp package.json package.json.bak
            jq '.main = "expo-router/entry"' package.json > package.json.tmp && mv package.json.tmp package.json
            cat package.json | grep "\"main\""
          else
            exit 1
          fi

      - name: 📋 Update metro.config.js for SVG support
        run: |
          if [ -f ./metro.config.js ]; then
            echo "Creating backup of metro.config.js"
            cp ./metro.config.js ./metro.config.js.backup
            echo "Updating metro.config.js to CommonJS format"
            cat > ./metro.config.js << 'EOFMARKER'
          /* eslint-disable @typescript-eslint/no-var-requires */
          const { getDefaultConfig } = require('expo/metro-config');

          const config = getDefaultConfig(__dirname);

          const { transformer, resolver } = config;

          config.transformer = {
            ...transformer,
            babelTransformerPath: require.resolve('react-native-svg-transformer/expo'),
          };

          config.resolver = {
            ...resolver,
            assetExts: resolver.assetExts.filter(ext => ext !== 'svg'),
            sourceExts: [...resolver.sourceExts, 'svg'],
          };

          module.exports = config;
          EOFMARKER
            echo "metro.config.js updated to CommonJS format"
          else
            echo "metro.config.js not found"
          fi

      - name: 🏷️ Generate build information
        id: build-info
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          APK_NAME="UPI-MCC-Checker-v${VERSION}.apk"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          git fetch --tags --force
          if git describe --tags --abbrev=0 > /dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            echo "## What's Changed since $LAST_TAG" > changelog.md
            git log $LAST_TAG..HEAD --pretty=format:"* **%s**%n%b" >> changelog.md
          else
            echo "## What's Changed" > changelog.md
            git log --pretty=format:"* **%s**%n%b" >> changelog.md
          fi

      - name: 📱 Build Production APK
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          npx eas-cli build --platform android --profile production-apk --local --non-interactive --output=./${{ steps.build-info.outputs.apk_name }}
          # Collect any split APKs generated in release directory
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} ./ \; 2>/dev/null || true
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC' -DreactNativeArchitectures=arm64-v8a,armeabi-v7a -DenableSeparateBuildPerCPUArchitecture=true"

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: "v${{ steps.build-info.outputs.version }}"
          tag_name: "v${{ steps.build-info.outputs.version }}-${{ steps.build-info.outputs.build_number }}"
          files: |
            ./*.apk
          body_path: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: app-builds
          path: |
            ./*.apk
          retention-days: 7
