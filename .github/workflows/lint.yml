name: Lint & Typecheck
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: 🏗 Enable Corepack
        run: corepack enable

      - name: 🏗 Setup Node.js & Yarn Cache
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: |
          rm -f package-lock.json
          yarn install --immutable

      - name: 🧹 Run Lint & Auto-fix if needed
        id: lint-step
        run: |
          echo "Running initial lint check..."
          if yarn lint; then
            echo "✅ Lint check passed with no errors."
            echo "fixes_applied=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Lint errors detected. Attempting auto-fix..."
            yarn lint:fix

            if [ -n "$(git status --porcelain)" ]; then
              echo "Re-running lint to verify if auto-fix resolved all issues..."
              if yarn lint; then
                echo "✅ All lint errors were successfully auto-fixed!"
                echo "fixes_applied=true" >> $GITHUB_OUTPUT
              else
                echo "❌ Lint errors remain after running auto-fix. Manual fixes required."
                exit 1
              fi
            else
              echo "❌ Lint failed and no auto-fixable issues were found. Manual fixes required."
              exit 1
            fi
          fi

      - name: 🏷️ Typecheck (TypeScript)
        run: yarn typecheck

      - name: 🚀 Auto-commit fixes to PR branch
        if: steps.lint-step.outputs.fixes_applied == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(lint): auto-fix linting and formatting issues'

      - name: 🚀 Create Pull Request for fixes
        if: steps.lint-step.outputs.fixes_applied == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(lint): auto-fix linting and formatting issues'
          title: 'chore: auto-fix lint and formatting issues'
          body: |
            ## Automated Lint Fixes
            
            This pull request was automatically generated by the **Lint & Typecheck** CI workflow.
            
            - Run auto-fix: `yarn lint:fix`
            - Verified clean lint: `yarn lint`
            - Verified TypeScript: `yarn typecheck`
          branch: 'chore/lint-fixes'
          delete-branch: true
